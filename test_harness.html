<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SillyTavern Simulation - Shapez Side Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #11131a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Mock SillyTavern Top Bar */
        #top-bar {
            height: 48px;
            background: #181b26;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        .st-brand {
            font-size: 15px;
            font-weight: bold;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .st-top-icons {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .st-icon-dummy {
            cursor: pointer;
            opacity: 0.7;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .st-icon-dummy:hover {
            opacity: 1;
        }
        /* Mock Chat Container */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            overflow-y: auto;
            gap: 16px;
        }
        .chat-msg {
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            max-width: 85%;
        }
        .chat-msg.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
        }
        .chat-msg.ai {
            align-self: flex-start;
            background: #1e2230;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
        }
        .chat-input-bar {
            height: 60px;
            background: #181b26;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }
        .chat-input {
            flex: 1;
            height: 38px;
            background: #222636;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0 14px;
            color: #fff;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- SillyTavern Mock Header -->
    <div id="top-bar">
        <div class="st-brand">
            <span>🎭 SillyTavern Simulation</span>
        </div>
        <div class="st-top-icons">
            <span class="st-icon-dummy" title="Characters">👥</span>
            <span class="st-icon-dummy" title="Settings">⚙️</span>
            <!-- Extension injects its button here -->
        </div>
    </div>

    <!-- Mock Chat Area -->
    <div id="chat-container">
        <div class="chat-msg ai">
            <strong>Assistant:</strong> Chào bạn! Cửa sổ game Shapez nổi bên trong SillyTavern đã được tích hợp hoàn chỉnh. Bạn có thể nhấn vào biểu tượng hình thoi 🔷 trên thanh công cụ để mở hoặc kéo thả tự do!
        </div>
        <div class="chat-msg user">
            Tuyệt vời! Tôi vừa có thể trò chuyện vừa xây dựng dây chuyền nhà máy tự động hóa.
        </div>
    </div>

    <!-- Mock Chat Input -->
    <div class="chat-input-bar">
        <input class="chat-input" placeholder="Type a message to chat..." readonly />
    </div>

    <!-- Load the extension -->
    <script src="index.js"></script>
</body>
</html>
