name: CI Codebase Quality & Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint and Validate Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Standalone Integrity Test (Zero-Dependency)
        run: node scripts/check-codebase.js

      - name: Install Lint Dependencies
        run: npm ci || npm install

      - name: Run Full Code Quality Check
        run: npm run check
